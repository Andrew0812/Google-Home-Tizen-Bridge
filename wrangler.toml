# Cloudflare Workers Configuration for Tizen Google Home Bridge
# Official Docs: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "tizen-bridge"
main = "worker.js"
compatibility_date = "2024-01-01"

# KV Namespace Binding
# Replace "YOUR_KV_NAMESPACE_ID" with the ID generated when you run:
#   npx wrangler kv:namespace create TIZEN_KV
# or create it in the Cloudflare Dashboard under Workers & Pages > KV.
[[kv_namespaces]]
binding = "TIZEN_KV"
id = "YOUR_KV_NAMESPACE_ID"

# Optional: Default environment variables
[vars]
TV_NAME = "Living Room TV"

# Secrets (Do NOT hardcode these here. Set them via the Cloudflare dashboard or `wrangler secret put`):
# - SMARTTHINGS_CLIENT_ID
# - SMARTTHINGS_CLIENT_SECRET
# - GOOGLE_CLIENT_ID (optional)
# - GOOGLE_CLIENT_SECRET (optional)
